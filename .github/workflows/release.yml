name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    if: ${{ (github.event.pull_request.merged == true && !(contains(github.event.pull_request.labels.*.name, 'minor')) && !(contains(github.event.pull_request.labels.*.name, 'dependencies'))) || github.event_name == 'workflow_dispatch' }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
      
    - name: Install Linux dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      
    - name: Build application
      run: npm run tauri build
      
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: artifacts-${{ matrix.os }}
        path: src-tauri/target/release/bundle
        
  create-release:
    needs: release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      
    - name: Get version
      id: version
      run: |
        version=$(node -p "require('./package.json').version")
        echo "version=$version" >> $GITHUB_OUTPUT
        
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts
        
    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        name: Release ${{ steps.version.outputs.version }}
        tag_name: v${{ steps.version.outputs.version }}
        generate_release_notes: true
        files: |
          artifacts/**/*.exe
          artifacts/**/*.rpm
          artifacts/**/*.msi
          artifacts/**/*.deb
          artifacts/**/*.AppImage
          artifacts/**/*.dmg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

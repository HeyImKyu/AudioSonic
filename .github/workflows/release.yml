name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    if: ${{ (github.event.pull_request.merged == true && !(contains(github.event.pull_request.labels.*.name, 'minor')) && !(contains(github.event.pull_request.labels.*.name, 'dependencies'))) || github.event_name == 'workflow_dispatch' }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: desktop
          - os: ubuntu-latest
            target: desktop
          - os: macos-latest
            target: desktop
          - os: ubuntu-latest
            target: android
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Install Rust Android targets
      if: matrix.target == 'android'
      run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      
    - name: Install Linux dependencies
      if: matrix.os == 'ubuntu-latest' && matrix.target != 'android'
      run: |
        sudo apt-get update
        sudo apt install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
    
    - name: Install Android dependencies
      if: matrix.target == 'android'
      run: |
        sudo apt-get update
        sudo apt install -y openjdk-17-jdk
    
    - name: Setup Android SDK
      if: matrix.target == 'android'
      uses: android-actions/setup-android@v3

    - name: Create Android debug keystore
      if: matrix.target == 'android'
      shell: bash
      run: |
        mkdir -p ~/.android
        if [ ! -f ~/.android/debug.keystore ]; then
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "Debug keystore created."
        else
          echo "Debug keystore already exists."
        fi
    
    - name: Initialize Android project
      if: matrix.target == 'android'
      run: npm run tauri android init
    
    - name: Build application
      if: matrix.target != 'android'
      run: npm run tauri build
    
    - name: List build outputs
      if: matrix.target != 'android'
      shell: bash
      run: |
        echo "Build outputs:"
        ls -la src-tauri/target/release/bundle/ || echo "Bundle directory not found"
        echo "Target directory:"
        ls -la src-tauri/target/release/ || echo "Release directory not found"
    
    - name: Build Android APK
      if: matrix.target == 'android'
      run: npm run tauri android build --debug

    - name: Verify APK is signed
      if: matrix.target == 'android'
      shell: bash
      run: |
        APK=$(find src-tauri/gen/android -name "*.apk" -print -quit)
        if [ -z "$APK" ]; then
          echo "No APK found after build."
          exit 1
        fi
        echo "Found APK: $APK"
        APKSIGNER=$(find "${ANDROID_SDK_ROOT}/build-tools" -name "apksigner" | sort | tail -1)
        "$APKSIGNER" verify --verbose "$APK"
      
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: artifacts-${{ matrix.os }}${{ matrix.target == 'android' && '-android' || '' }}
        path: ${{ matrix.target == 'android' && 'src-tauri/gen/android/**/outputs/**/*.apk' || 'src-tauri/target/release/bundle' }}
        
  create-release:
    needs: release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      
    - name: Get version
      id: version
      run: |
        version=$(node -p "require('./package.json').version")
        echo "version=$version" >> $GITHUB_OUTPUT
        
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts
        
    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        name: Release ${{ steps.version.outputs.version }}
        tag_name: v${{ steps.version.outputs.version }}
        generate_release_notes: true
        files: |
          artifacts/**/*.exe
          artifacts/**/*.rpm
          artifacts/**/*.msi
          artifacts/**/*.deb
          artifacts/**/*.AppImage
          artifacts/**/*.dmg
          artifacts/**/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

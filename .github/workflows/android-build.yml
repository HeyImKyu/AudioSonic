name: Android Build

on:
  workflow_dispatch:

jobs:
  android-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
    
    - name: Install Android dependencies
      run: |
        sudo apt-get update
        sudo apt install -y openjdk-17-jdk
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Initialize Android project
      run: npm run tauri android init
    
    - name: Build Android APK
      run: npm run tauri android build --debug

    - name: Verify generated APKs
      shell: bash
      run: |
        if [ ! -d "src-tauri/gen/android" ]; then
          echo "Android project directory not found."
          exit 1
        fi
        find src-tauri/gen/android -type f -name "*.apk" -print
        test -n "$(find src-tauri/gen/android -type f -name "*.apk" -print -quit)"
      
    - name: Upload Android artifacts
      uses: actions/upload-artifact@v7
      with:
        name: android-apk
        path: src-tauri/gen/android/**/outputs/**/*.apk

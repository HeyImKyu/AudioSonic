name: Android Build

on:
  workflow_dispatch:

jobs:
  android-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Install Rust Android targets
      run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
    
    - name: Install Android dependencies
      run: |
        sudo apt-get update
        sudo apt install -y openjdk-17-jdk
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Create Android debug keystore
      shell: bash
      run: |
        mkdir -p ~/.android
        if [ ! -f ~/.android/debug.keystore ]; then
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "Debug keystore created."
        else
          echo "Debug keystore already exists."
        fi
    
    - name: Initialize Android project
      run: npm run tauri -- android init
    
    - name: Build Android APK
      # Use -- to pass flags through npm to tauri; without it npm intercepts --debug
      run: npm run tauri -- android build --debug

    - name: Sign APK if unsigned
      shell: bash
      run: |
        APK=$(find src-tauri/gen/android -name "*.apk" -print -quit)
        if [ -z "$APK" ]; then
          echo "No APK found after build."
          exit 1
        fi
        echo "Found APK: $APK"
        APKSIGNER=$(find "${ANDROID_SDK_ROOT}/build-tools" -name "apksigner" | sort | tail -1)
        ZIPALIGN=$(find "${ANDROID_SDK_ROOT}/build-tools" -name "zipalign" | sort | tail -1)

        # Check if already signed
        if "$APKSIGNER" verify "$APK" 2>/dev/null; then
          echo "APK is already signed."
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
        else
          echo "APK is unsigned, signing now..."
          keytool -genkeypair -v \
            -keystore /tmp/ci-key.jks \
            -storepass android -alias androidkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=CI Build,O=CI,C=US"
          ALIGNED_APK="${APK/-unsigned/}"
          if [ "$ALIGNED_APK" = "$APK" ]; then
            ALIGNED_APK="${APK%.apk}-aligned.apk"
          fi
          "$ZIPALIGN" -v 4 "$APK" "$ALIGNED_APK"
          "$APKSIGNER" sign \
            --ks /tmp/ci-key.jks --ks-pass pass:android \
            --key-pass pass:android --ks-key-alias androidkey \
            "$ALIGNED_APK"
          "$APKSIGNER" verify --verbose "$ALIGNED_APK"
          echo "APK_PATH=$ALIGNED_APK" >> "$GITHUB_ENV"
        fi
      
    - name: Upload Android artifacts
      uses: actions/upload-artifact@v7
      with:
        name: android-apk
        path: ${{ env.APK_PATH }}
